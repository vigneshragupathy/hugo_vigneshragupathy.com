    #mc_embed_signup{
      background: var(--entry, #fff);
      color: var(--primary, #1e1e1e);
      font-family: inherit;
      width: 100%;
      max-width: 560px;
      margin: 48px auto 24px;
      padding: 32px 28px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius, 8px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .dark #mc_embed_signup{
      background: var(--entry, #2e2e33);
      color: var(--primary, #dadadb);
      border-color: var(--border, #333);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }
    #mc_embed_signup h2{
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.3;
      color: var(--primary, #1e1e1e);
    }
    .dark #mc_embed_signup h2{
      color: var(--primary, #dadadb);
    }
    #mc_embed_signup .signup-subtext{
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--secondary, #6c6c6c);
    }
    #mc_embed_signup .signup-row{
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      max-width: 440px;
      margin: 0 auto;
    }
    #mc_embed_signup .mc-field-group{
      flex: 1 1 auto;
      min-width: 0;
    }
    #mc_embed_signup .mc-field-group label{
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    #mc_embed_signup input.email{
      width: 100%;
      height: 46px;
      box-sizing: border-box;
      padding: 0 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--primary, #1e1e1e);
      background: var(--theme, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: var(--radius, 8px);
      transition: border-color 0.2s ease;
    }
    .dark #mc_embed_signup input.email{
      color: var(--primary, #dadadb);
      background: var(--theme, #1d1e20);
      border-color: var(--border, #333);
    }
    #mc_embed_signup input.email::placeholder{
      color: var(--secondary, #6c6c6c);
      opacity: 0.8;
    }
    #mc_embed_signup input.email:focus{
      outline: none;
      border-color: var(--secondary, #6c6c6c);
    }
    #mc_embed_signup .button{
      flex: 0 0 auto;
      height: 46px;
      box-sizing: border-box;
      margin: 0;
      padding: 0 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
      color: var(--theme, #fff);
      background: var(--primary, #1e1e1e);
      border: none;
      border-radius: var(--radius, 8px);
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .dark #mc_embed_signup .button{
      color: var(--theme, #1d1e20);
      background: var(--primary, #dadadb);
    }
    #mc_embed_signup .button:hover{
      opacity: 0.85;
    }
    #mc_embed_signup #mce-responses{
      margin: 0 auto;
      max-width: 440px;
      font-size: 14px;
      text-align: left;
    }
    #mc_embed_signup .response{
      margin-top: 12px;
    }
    #mc_embed_signup #mce-error-response{
      color: #e05d44;
    }
    #mc_embed_signup #mce-success-response{
      color: #2e9e63;
    }
    #mc_embed_signup div.mce_inline_error{
      margin-top: 8px;
      padding: 0;
      font-size: 13px;
      font-weight: 400;
      color: #e05d44 !important;
      background: none !important;
      text-align: left;
    }
    #mc_embed_signup input.mce_inline_error{
      border-color: #e05d44 !important;
    }
    #mc_embed_signup .signup-branding{
      margin: 18px 0 0;
      font-size: 12px;
    }
    #mc_embed_signup .signup-branding a{
      color: var(--secondary, #6c6c6c);
      opacity: 0.7;
      text-decoration: none;
    }
    #mc_embed_signup .signup-branding a:hover{
      opacity: 1;
      text-decoration: underline;
    }
    @media (max-width: 480px){
      #mc_embed_signup{
        padding: 24px 18px;
      }
      #mc_embed_signup .signup-row{
        flex-direction: column;
      }
      #mc_embed_signup .button{
        width: 100%;

    <script type="text/javascript" src="//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script><script type="text/javascript">(function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';fnames[5]='BIRTHDAY';ftypes[5]='birthday';fnames[6]='COMPANY';ftypes[6]='text';}(jQuery));var $mcj = jQuery.noConflict(true);
      // SMS Phone Multi-Country Functionality
      if(!window.MC) {

      function getCountryUnicodeFlag(countryCode) {
         return countryCode.toUpperCase().replace(/./g, (char) => String.fromCodePoint(char.charCodeAt(0) + 127397))
      };

      // HTML sanitization function to prevent XSS
      function sanitizeHtml(str) {
        if (typeof str !== 'string') return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#x27;')
          .replace(/\//g, '&#x2F;');
      }

      // URL sanitization function to prevent javascript: and data: URLs
      function sanitizeUrl(url) {
        if (typeof url !== 'string') return '';
        const trimmedUrl = url.trim().toLowerCase();
        if (trimmedUrl.startsWith('javascript:') || trimmedUrl.startsWith('data:') || trimmedUrl.startsWith('vbscript:')) {
          return '#';
        }
        return url;
      }

      const getBrowserLanguage = () => {
        if (!window?.navigator?.language?.split('-')[1]) {
          return window?.navigator?.language?.toUpperCase();
        }
        return window?.navigator?.language?.split('-')[1];
      };

      function getDefaultCountryProgram(defaultCountryCode, smsProgramData) {
        if (!smsProgramData || smsProgramData.length === 0) {
          return null;
        }

        const browserLanguage = getBrowserLanguage();

        if (browserLanguage) {
          const foundProgram = smsProgramData.find(
            (program) => program?.countryCode === browserLanguage,
          );
          if (foundProgram) {
            return foundProgram;
          }
        }

        if (defaultCountryCode) {
          const foundProgram = smsProgramData.find(
            (program) => program?.countryCode === defaultCountryCode,
          );
          if (foundProgram) {
            return foundProgram;
          }
        }

        return smsProgramData[0];
      }

      function updateSmsLegalText(countryCode, fieldName) {
        if (!countryCode || !fieldName) {
          return;
        }
        
        const programs = window?.MC?.smsPhoneData?.programs;
        if (!programs || !Array.isArray(programs)) {
          return;
        }
        
        const program = programs.find(program => program?.countryCode === countryCode);
        if (!program || !program.requiredTemplate) {
          return;
        }
        
        const legalTextElement = document.querySelector('#legal-text-' + fieldName);
        if (!legalTextElement) {
          return;
        }
        
        // Remove HTML tags and clean up the text
        const divRegex = new RegExp('</?[div][^>]*>', 'gi');
        const fullAnchorRegex = new RegExp('<a.*?</a>', 'g');
        const anchorRegex = new RegExp('<a href="(.*?)" target="(.*?)">(.*?)</a>');
        
        const requiredLegalText = program.requiredTemplate
          .replace(divRegex, '')
          .replace(fullAnchorRegex, '')
          .slice(0, -1);
        
        const anchorMatches = program.requiredTemplate.match(anchorRegex);
        
        if (anchorMatches && anchorMatches.length >= 4) {
          // Create link element safely using DOM methods instead of innerHTML
          const linkElement = document.createElement('a');
          linkElement.href = sanitizeUrl(anchorMatches[1]);
          linkElement.target = sanitizeHtml(anchorMatches[2]);
          linkElement.textContent = sanitizeHtml(anchorMatches[3]);
          
          legalTextElement.textContent = requiredLegalText + ' ';
          legalTextElement.appendChild(linkElement);
          legalTextElement.appendChild(document.createTextNode('.'));
        } else {
          legalTextElement.textContent = requiredLegalText + '.';
        }
      }

      function generateDropdownOptions(smsProgramData) {
        if (!smsProgramData || smsProgramData.length === 0) {
          return '';
        }
        
        return smsProgramData.map(program => {
          const flag = getCountryUnicodeFlag(program.countryCode);
          const countryName = getCountryName(program.countryCode);
          const callingCode = program.countryCallingCode || '';
          // Sanitize all values to prevent XSS
          const sanitizedCountryCode = sanitizeHtml(program.countryCode || '');
          const sanitizedCountryName = sanitizeHtml(countryName || '');
          const sanitizedCallingCode = sanitizeHtml(callingCode || '');
          return '<option value="' + sanitizedCountryCode + '">' + sanitizedCountryName + ' ' + sanitizedCallingCode + '</option>';
        }).join('');
      }

      function getCountryName(countryCode) {
        if (window.MC?.smsPhoneData?.smsProgramDataCountryNames && Array.isArray(window.MC.smsPhoneData.smsProgramDataCountryNames)) {
          for (let i = 0; i < window.MC.smsPhoneData.smsProgramDataCountryNames.length; i++) {
            if (window.MC.smsPhoneData.smsProgramDataCountryNames[i].code === countryCode) {
              return window.MC.smsPhoneData.smsProgramDataCountryNames[i].name;
            }
          }
        }
        return countryCode;
      }

      function updatePlaceholder(countryCode, fieldName) {

        if (!countryCode || typeof countryCode !== 'string') {

      function setDefaultHelpText(countryCode) {
        const helpTextSpan = document.querySelector('#help-text');
        if (!helpTextSpan) {

      function updateHelpTextCountryCode(countryCode, fieldName) {

      function initializeSmsPhoneDropdown(fieldName) {
        if (!fieldName || typeof fieldName !== 'string') {
          return;
        }
        
        const dropdown = document.querySelector('#country-select-' + fieldName);
        const displayFlag = document.querySelector('#flag-display-' + fieldName);
        
        if (!dropdown || !displayFlag) {
          return;
        }

        const smsPhoneData = window.MC?.smsPhoneData;
        if (smsPhoneData && smsPhoneData.programs && Array.isArray(smsPhoneData.programs)) {
          dropdown.innerHTML = generateDropdownOptions(smsPhoneData.programs);
        }

        const defaultProgram = getDefaultCountryProgram(smsPhoneData?.defaultCountryCode, smsPhoneData?.programs);
        if (defaultProgram && defaultProgram.countryCode) {
          dropdown.value = defaultProgram.countryCode;
          
          const flagSpan = displayFlag?.querySelector('#flag-emoji-' + fieldName);
          if (flagSpan) {
            flagSpan.textContent = getCountryUnicodeFlag(defaultProgram.countryCode);
            flagSpan.setAttribute('aria-label', sanitizeHtml(defaultProgram.countryCode) + ' flag');
          }
          
          updateSmsLegalText(defaultProgram.countryCode, fieldName);
          updatePlaceholder(defaultProgram.countryCode, fieldName);
          updateCountryCodeInstruction(defaultProgram.countryCode, fieldName);
        }

       
        var phoneInput = document.querySelector('#mce-' + fieldName);
        if (phoneInput && defaultProgram.countryCallingCode) {
          phoneInput.value = defaultProgram.countryCallingCode;
        }
        


        displayFlag?.addEventListener('click', function(e) {
          dropdown.focus();
        });


        dropdown?.addEventListener('change', function() {
          const selectedCountry = this.value;
          
          if (!selectedCountry || typeof selectedCountry !== 'string') {
            return;
          }
          
          const flagSpan = displayFlag?.querySelector('#flag-emoji-' + fieldName);
          if (flagSpan) {
            flagSpan.textContent = getCountryUnicodeFlag(selectedCountry);
            flagSpan.setAttribute('aria-label', sanitizeHtml(selectedCountry) + ' flag');
          }

           
          const selectedProgram = window.MC?.smsPhoneData?.programs.find(function(program) {
            return program && program.countryCode === selectedCountry;
          });
          var phoneInput = document.querySelector('#mce-' + fieldName);
          if (phoneInput && selectedProgram.countryCallingCode) {
            phoneInput.value = selectedProgram.countryCallingCode;
          }
          
          
          updateSmsLegalText(selectedCountry, fieldName);
          updatePlaceholder(selectedCountry, fieldName);
          updateCountryCodeInstruction(selectedCountry, fieldName);
        });
      }

      document.addEventListener('DOMContentLoaded', function() {
        const smsPhoneFields = document.querySelectorAll('[id^="country-select-"]');
        
        smsPhoneFields.forEach(function(dropdown) {
          const fieldName = dropdown?.id.replace('country-select-', '');
          initializeSmsPhoneDropdown(fieldName);
        });
      });
